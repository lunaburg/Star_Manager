<!doctype html><meta charset="utf-8"><title>女性服装图标预览</title>
<style>body{margin:0;background:#f7f4ff;color:#242044;font:16px system-ui;padding:40px}h1{margin:0 0 8px;font-size:32px}.sub{color:#716b91;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;max-width:920px}.card{background:#fff;border:1px solid #e7e1fa;border-radius:22px;padding:20px;text-align:center;box-shadow:0 8px 24px #3c2d7812}.card img{width:128px;height:128px;display:block;margin:auto}.label{margin-top:10px;font-weight:700}.en{font-size:12px;color:#958eae;margin-top:3px}</style>
<h1>女性服装 · 卡通图标</h1><div class="sub">统一线条与配色，适合卡片分类、筛选和空状态</div><div class="grid" id="grid"></div>
<script>const items=[['上衣','Top','top'],['下衣','Bottom','bottom'],['内衣','Bra','bra'],['内裤','Panties','panties'],['手套','Gloves','gloves'],['裤袜','Tights','tights'],['袜子','Socks','socks'],['鞋子','Heels','heels']];grid.innerHTML=items.map(x=>`<div class="card"><img src="../src/assets/clothing-icons/${x[2]}.svg"><div class="label">${x[0]}</div><div class="en">${x[1]}</div></div>`).join('')</script>
